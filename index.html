  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #b91c1c;
      --accent-hover: #991b1b;
      --navy: #0f172a;
      --border: #e2e8f0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .img-contain {
      object-fit: contain;
      background-color: #f1f5f9;
    }

    .view-page {
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }

    .view-page.active {
      display: block;
      opacity: 1;
    }

    .nav-btn.active {
      background-color: #b91c1c;
      color: #ffffff;
      border-color: #b91c1c;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      line-height: 1;
      padding: 5px 15px;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: #bbb;
    }

    details > summary::-webkit-details-marker {
      display: none;
    }
  </style>
