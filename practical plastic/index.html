<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical Plastic — Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 2rem;
      color: #58a6ff;
      margin-bottom: 10px;
    }
    p.tagline {
      font-size: 1.1rem;
      color: #8b949e;
      margin-bottom: 25px;
      font-weight: 500;
    }
    .badge {
      display: inline-block;
      background-color: #238636;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }
    p.description {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #c9d1d9;
    }
    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #484f58;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Practical Plastic</h1>
    <p class="tagline">3D Designed ★ 3D Printed ★ Original Products</p>
    
    <div class="badge">Under Construction</div>
    
    <p class="description">
      We're currently building our new website to showcase our line of custom 3D printed products and solutions. Check back soon for updates!
    </p>
    
    <footer>
      &copy; Practical Plastic. All rights reserved.
    </footer>
  </div>

</body>
</html>
