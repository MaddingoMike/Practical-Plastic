<!-- SNAPSHIELD SECTION -->
<div id="snapshield-section" class="bg-white p-6 rounded-lg shadow-md mb-8">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
    
    <!-- Image Gallery Side -->
    <div class="flex flex-col items-center">
      <!-- Main Featured Image -->
      <div class="w-full h-80 bg-slate-200 rounded-lg overflow-hidden border border-slate-300 mb-4 flex items-center justify-center p-2">
        <img 
          id="snapshield-main-img" 
          src="snapshield/snapshield_product_front.jpg" 
          alt="SNAPSHIELD Featured View" 
          class="h-full w-full object-contain object-top"
        />
      </div>

      <!-- Image Gallery Thumbnails -->
      <div class="grid grid-cols-3 gap-2 w-full">
        <img 
          src="snapshield/snapshield_product_front.jpg" 
          alt="SNAPSHIELD Front View"
          onclick="document.getElementById('snapshield-main-img').src = this.src"
          class="w-full h-20 bg-slate-200 object-contain object-top pt-1 rounded-md border-2 border-slate-300 hover:border-red-700 cursor-pointer transition-all"
        />
        <img 
          src="snapshield/snapshield_product_back.jpg" 
          alt="SNAPSHIELD Back View"
          onclick="document.getElementById('snapshield-main-img').src = this.src"
          class="w-full h-20 bg-slate-200 object-contain object-top pt-1 rounded-md border-2 border-slate-300 hover:border-red-700 cursor-pointer transition-all"
        />
        <img 
          src="snapshield/receptacle_1.jpg" 
          alt="SNAPSHIELD Receptacle View"
          onclick="document.getElementById('snapshield-main-img').src = this.src"
          class="w-full h-20 bg-slate-200 object-contain object-top pt-1 rounded-md border-2 border-slate-300 hover:border-red-700 cursor-pointer transition-all"
        />
      </div>
    </div>

    <!-- Product Details Side -->
    <div class="flex flex-col h-full justify-between">
      <div>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">SNAPSHIELD™</h2>
        <p class="text-slate-600 mb-4">
          Protective outlet and switch guard designed for seamless installation and maximum durability.
        </p>
      </div>

      <div class="mt-4 pt-4 border-t border-slate-200">
        <button class="w-full bg-red-700 hover:bg-red-800 text-white font-semibold py-3 px-6 rounded-md shadow transition-colors">
          View SNAPSHIELD™ Options
        </button>
      </div>
    </div>

  </div>
</div>
